name: sla-industries CI

permissions:
    contents: read

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

# A newer push to a pull request cancels that PR's still-running pipeline (each run starts four
# Foundry instances on the shared license). Pushes to main get a group of their own (the run id),
# so none is ever cancelled or dropped from the queue.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Fast gate that decides whether the rest of the pipeline has anything to verify.
    # A change that only touches documentation (*.md files, .docs/, LICENSE) has no code or
    # tests to run, so the e2e job is skipped for it, on pushes to main and on pull requests.
    # The build job (Prettier also checks the markdown) is skipped for docs-only pushes to main
    # but always runs on pull requests, since it is the check PRs are gated on. Any doubt (no
    # usable base commit, empty diff) fails open: docs_only=false and the full pipeline runs.
    changes:
        runs-on: ubuntu-latest
        outputs:
            docs_only: ${{ steps.detect.outputs.docs_only }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Determine whether this change is docs-only
              id: detect
              env:
                  # push: the previous tip of main. pull_request: the PR's base; github.sha is then
                  # the merge commit, which contains the base, so the diff is exactly the PR's change.
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.sha }}
              run: |
                  if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
                    echo "No usable base commit to diff against — running full CI." >&2
                    echo "docs_only=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
                  echo "Changed files:"
                  echo "$changed"

                  if [[ -z "$changed" ]]; then
                    echo "docs_only=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  non_docs=$(echo "$changed" | grep -Ev '(\.md$|^\.docs/|^LICENSE(\.[A-Za-z]+)?$)' || true)

                  if [[ -z "$non_docs" ]]; then
                    echo "Docs-only change detected — skipping e2e (and build, for a push)." >&2
                    echo "docs_only=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "docs_only=false" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: changes
        if: always() && (github.event_name == 'pull_request' || needs.changes.outputs.docs_only != 'true')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify package.json and system.json versions match
              run: node scripts/validate-dist.mjs --sync-only

            - name: Check formatting
              run: npm run format:check

            - name: Run unit tests
              run: npm run test:unit

            - name: Report unit test coverage
              run: npm run test:unit:coverage
              continue-on-error: true

            - name: Build dist
              run: npm run build

            - name: Validate dist artifacts
              run: npm run validate:dist

    # Optional, best-effort E2E gate: only runs when Foundry download credentials are
    # configured as repo secrets (see .docs/AGENTS.md), and only against same-repo
    # branches/PRs so those secrets are never exposed to a fork. Starts as
    # continue-on-error while it proves out; a maintainer can drop that once it's
    # reliably green. Foundry VTT requires a maintainer-owned license — set
    # FOUNDRY_RELEASE_URL (or FOUNDRY_USERNAME + FOUNDRY_ACCOUNT_PASSWORD),
    # FOUNDRY_LICENSE_KEY, FOUNDRY_USER and FOUNDRY_PASSWORD under repo Settings → Secrets
    # to enable it; without them this job no-ops. Runs on pushes to main and on same-repo pull
    # requests, but not for docs-only changes (see the `changes` job). `always()` is needed here:
    # without a status function a job is skipped whenever a job upstream of it was skipped.
    #
    # Sharded: each matrix job boots its own Foundry (own container, own world data, so the
    # one-login-per-user and shared-world-state constraints of a single instance don't apply)
    # and runs a Playwright --shard slice of the regression suite. playwright.config.js sets
    # fullyParallel with workers: 1, so shards split individual tests (not whole files) while
    # each Foundry still runs one test at a time. The single-file operator and visual suites
    # are pinned to one shard each so they run exactly once. All shards use the same
    # FOUNDRY_LICENSE_KEY at the same time; that has run cleanly (see .docs/LESSONS_LEARNED.md).
    e2e:
        name: e2e (shard ${{ matrix.shard }}/${{ matrix.shard_total }})
        needs: [changes, build]
        if: >-
            always() && needs.build.result == 'success' && needs.changes.outputs.docs_only != 'true' &&
            (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-latest
        continue-on-error: true
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
                shard_total: [4]
        env:
            FOUNDRY_DATA_DIR: ${{ github.workspace }}/.foundry-data
            FOUNDRY_USER: ${{ secrets.FOUNDRY_USER }}
            FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
            FOUNDRY_RELEASE_URL: ${{ secrets.FOUNDRY_RELEASE_URL }}
            FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
            FOUNDRY_ACCOUNT_PASSWORD: ${{ secrets.FOUNDRY_ACCOUNT_PASSWORD }}
            FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check for Foundry credentials
              id: creds
              run: |
                  if [[ -z "${FOUNDRY_RELEASE_URL}" && -z "${FOUNDRY_USERNAME}" ]]; then
                    echo "No Foundry download credentials configured (FOUNDRY_RELEASE_URL / FOUNDRY_USERNAME) — skipping E2E. See .docs/AGENTS.md." >&2
                    echo "present=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "present=true" >> "$GITHUB_OUTPUT"
                  fi

            # scripts/cloud-foundry.sh's readiness check (foundry_join_ready) shells out to
            # ripgrep, which isn't preinstalled on ubuntu-latest runners.
            - name: Install ripgrep
              if: steps.creds.outputs.present == 'true'
              run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

            - name: Install Playwright browsers
              if: steps.creds.outputs.present == 'true'
              run: npm run test:e2e:install

            # Caches the downloaded Foundry release zip so repeat runs don't depend on
            # FOUNDRY_RELEASE_URL's timed URL, which expires within minutes.
            - name: Cache Foundry release download
              if: steps.creds.outputs.present == 'true'
              uses: actions/cache@v4
              with:
                  path: ${{ env.FOUNDRY_DATA_DIR }}/container_cache
                  key: foundry-release-${{ hashFiles('system.json') }}

            - name: Start Foundry
              if: steps.creds.outputs.present == 'true'
              run: bash scripts/cloud-foundry.sh start

            - name: Run E2E regression suite (shard ${{ matrix.shard }}/${{ matrix.shard_total }})
              if: steps.creds.outputs.present == 'true'
              run: npm run test:e2e:regression -- --shard=${{ matrix.shard }}/${{ matrix.shard_total }}

            - name: Run E2E operator suite (GM-only)
              if: steps.creds.outputs.present == 'true' && matrix.shard == 1
              run: npm run test:e2e:operators

            - name: Run E2E visual regression suite (best-effort, needs committed baselines)
              if: steps.creds.outputs.present == 'true' && matrix.shard == 4
              continue-on-error: true
              run: npm run test:e2e:visual
